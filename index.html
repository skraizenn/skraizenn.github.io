<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@skraizenn</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: rgba(14, 14, 16, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #ffffff;
      --text-muted: #8a8f98;
      --accent: #ffffff;
      --accent-glow: rgba(255, 255, 255, 0.12);
      --badge-bg: rgba(255, 255, 255, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 24px 24px;
    }
	
    .profile-card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 32px 24px 24px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 0 50px -10px rgba(0, 0, 0, 0.8), 0 0 30px 0 rgba(255, 255, 255, 0.02);
      position: relative;
	  zoom: 1.50;
    }

    .avatar-box {
      position: relative;
      margin-bottom: 16px;
    }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 25px var(--accent-glow);
    }

    .user-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .username {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .verified-badge {
      width: 18px;
      height: 18px;
      fill: #38bdf8;
    }

    .badges-row {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }

    .badge {
      background: var(--badge-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-size: 0.7rem;
      font-family: monospace;
      padding: 3px 8px;
      border-radius: 6px;
    }


    .bio {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 22px;
      line-height: 1.4;
      font-weight: 400;
    }

    .socials-row {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .social-btn {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: var(--badge-bg);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .social-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      transition: fill 0.2s ease;
    }

    .social-btn:hover {
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.08);
    }

    .music-widget {
      width: 100%;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .album-art {
      width: 46px;
      height: 46px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .music-info {
      flex-grow: 1;
      min-width: 0;
    }

    .song-title {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      margin-top: 6px;
      position: relative;
    }

    .progress-fill {
      width: 58%;
      height: 100%;
      background: var(--text-main);
      border-radius: 2px;
    }

    .play-btn {
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .play-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .card-footer {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      gap: 6px;
      padding-top: 6px;
    }

    .card-footer svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
      opacity: 0.7;
    }
	
	#enter-overlay {
	position: fixed;
	top: 0;
	left: 0;
	width: 100vw;
	height: 100vh;
	background-color: #000000;
	display: flex;
	justify-content: center;
	align-items: center;
	z-index: 99999;
	cursor: pointer;
	transition: opacity 1.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s ease;
	}

	.enter-text {
	color: var(--text-muted);
	font-family: monospace;
	font-size: 0.95rem;
	letter-spacing: 0.15em;
	animation: pulseText 1.8s infinite ease-in-out;
	}

	@keyframes pulseText {
	0%, 100% { opacity: 0.4; }
	50% { opacity: 1; color: var(--text-main); }
	}

	#enter-overlay.hidden {
	opacity: 0;
	visibility: hidden;
	pointer-events: none;
	}
	
	.volume-control {
	position: fixed;
	top: 20px;
	left: 20px;
	z-index: 100;
	display: flex;
	align-items: center;
	gap: 8px;
	background: rgba(14, 14, 16, 0.6);
	border: 1px solid rgba(255, 255, 255, 0.08);
	backdrop-filter: blur(12px);
	-webkit-backdrop-filter: blur(12px);
	padding: 8px 14px;
	border-radius: 999px;
	box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
	}

	.vol-icon {
	width: 18px;
	height: 18px;
	fill: var(--text-muted);
	cursor: pointer;
	flex-shrink: 0;
	transition: fill 0.2s ease;
	}

	.vol-icon:hover {
	fill: var(--text-main);
	}

	#volume-slider {
	-webkit-appearance: none;
	appearance: none;
	width: 60px;
	height: 3px;
	background: rgba(255, 255, 255, 0.15);
	border-radius: 2px;
	outline: none;
	cursor: pointer;
	}

	#volume-slider::-webkit-slider-thumb {
	-webkit-appearance: none;
	appearance: none;
	width: 10px;
	height: 10px;
	border-radius: 50%;
	background: #ffffff;
	cursor: pointer;
	box-shadow: 0 0 6px rgba(255, 255, 255, 0.5);
	}
	
  </style>
</head>
<body>

	<div id="enter-overlay">
	<span class="enter-text">[ click to enter ]</span>
	</div>

	<audio id="bg-music" src="sarki.mp3" loop></audio>
  	
	<div class="volume-control">
	<svg id="mute-btn" class="vol-icon" viewBox="0 0 24 24" title="Sesi Aç/Kapat">

	</svg>
	<input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
	</div>

<script>

const overlay = document.getElementById('enter-overlay');
const music = document.getElementById('bg-music');

overlay.addEventListener('click', () => {
  music.play().catch(err => console.log("Ses oynatma hatasý:", err));
  
  overlay.classList.add('hidden');
});

const volumeSlider = document.getElementById('volume-slider');
const muteBtn = document.getElementById('mute-btn');

music.volume = 0.5;

volumeSlider.addEventListener('input', (e) => {
  music.volume = e.target.value;
  music.muted = false;
});

muteBtn.addEventListener('click', () => {
  music.muted = !music.muted;
  muteBtn.style.opacity = music.muted ? '0.3' : '1';
});

</script>
